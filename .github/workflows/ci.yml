name: Test and Build

# run when I push to main or make a pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install
        env:
          # no need for the cypress app here
          CYPRESS_INSTALL_BINARY: 0

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Build the app
        run: npm run build
        env:
          CI: false